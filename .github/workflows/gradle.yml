name: Java CI with Gradle

on:
  push:
    branches: [ "feature6" ]
  pull_request:
    branches: [ "main" ]

env:
  S3_BUCKET_NAME: build-jar-elbin-deploy
  PROJECT_NAME: spring-cafe

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: application.properties 파일 설정
      run: |
        mkdir -p src/main/resources
        echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.properties
        echo "${{ secrets.APPLICATION_DEPLOY_PROPERTIES }}" > ./src/main/resources/application-deploy.properties
        
    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build -x test

    - name: 빌드된 파일 이름 변경하기
      run: mv ./build/libs/*SNAPSHOT.jar ./springcafe.jar

    - name: Make zip file
      run: zip -r ./$GITHUB_SHA.zip .
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{ secrets.AWS_REGION}}

    - name: Upload to S3
      run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.zip s3://${{env.S3_BUCKET_NAME}}/${{env.PROJECT_NAME}}/$GITHUB_SHA.zip

    - name: Code Deploy
      run: aws deploy create-deployment --application-name spring-cafe-deploy --deployment-config-name CodeDeployDefault.AllAtOnce --deployment-group-name spring-cafe-code-deploy --s3-location bucket=$S3_BUCKET_NAME,bundleType=zip,key=$PROJECT_NAME/$GITHUB_SHA.zip                                               

    # - name: SCP로 EC2에 빌드된 파일 전송하기
    #   uses: appleboy/scp-action@master
