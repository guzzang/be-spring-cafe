<!DOCTYPE html>
<html lang="kr">
    <div th:replace="~{fragment/header :: header}"></div>
    <body>
    <div th:replace="~{fragment/nav :: nav}"></div>
    <div th:replace="~{fragment/nav :: subnav}"></div>
    <div class="container" id="main">
        <div class="col-md-6 col-md-offset-3">
            <div class="panel panel-default content-main">
          <div th:if="${errorMessage}" class="alert alert-danger">
              <p th:text="${errorMessage}"></p>
          </div>

          <form name="question" th:action="@{/users/{id}/update (id=${user.id})}"  method="post" >

              <div class="form-group">
                  <label for="userId" hidden>사용자 아이디</label>
                  <input type="hidden" class="form-control" id="userId" name="userId" placeholder="User ID">
              </div>
              <div class="form-group">
                  <label for="password">비밀번호</label>
                  <input type="password" class="form-control" id="password" name="password" placeholder="Password">
              </div>
              <div class="form-group">
                  <label for="name">이름</label>
                  <input class="form-control" id="name" name="name" placeholder="Name">
              </div>
              <div class="form-group">
                  <label for="email">이메일</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="Email">
              </div>
              <button type="submit" class="btn btn-success clearfix pull-right">수정</button>
              <div class="clearfix"></div>
          </form>
        </div>
    </div>
</div>
    <div th:replace="~{fragment/footer :: footer}"></div>
	</body>
</html>
