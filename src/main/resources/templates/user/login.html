<!DOCTYPE html>
<html lang="kr">
    <div th:replace="~{fragment/header :: header}"></div>
    <body>
    <div th:replace="~{fragment/nav :: nav}"></div>
    <div th:replace="~{fragment/nav :: subnav}"></div>

<div class="container" id="main">
   <div class="col-md-6 col-md-offset-3">
      <div class="panel panel-default content-main">
          <form name="question" method="post" action="/users/login" th:object="${loginForm}">
              <!-- 🔹 글로벌 에러 메시지 출력 -->
              <div th:if="${session.loginUser != null and #fields.hasGlobalErrors()}" class="alert alert-danger">
                  <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
              </div>

              <div class="form-group">
                  <label for="userId">사용자 아이디</label>
                  <input class="form-control" id="userId" name="userId" placeholder="User ID">
              </div>
              <div class="form-group">
                  <label for="password">비밀번호</label>
                  <input type="password" class="form-control" id="password" name="password" placeholder="Password">
              </div>
              <button type="submit" class="btn btn-success clearfix pull-right">로그인</button>
              <div class="clearfix" />
          </form>
        </div>
    </div>
</div>
    <div th:replace="~{fragment/footer :: footer}"></div>
	</body>
</html>
