<div class="navbar navbar-default" id="subnav">
    <div class="col-md-12">
        <div class="navbar-header">
            <a href="#" style="margin-left:15px;" class="navbar-btn btn btn-default btn-plus dropdown-toggle" data-toggle="dropdown"><i class="glyphicon glyphicon-home" style="color:#dd1111;"></i> Home <small><i class="glyphicon glyphicon-chevron-down"></i></small></a>
            <ul class="nav dropdown-menu">
                <li><a href="../../templates/user/profile.html"><i class="glyphicon glyphicon-user" style="color:#1111dd;"></i> Profile</a></li>
                <li class="nav-divider"></li>
                <li><a href="#"><i class="glyphicon glyphicon-cog" style="color:#dd1111;"></i> Settings</a></li>

            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar-collapse2">

                <!-- 🔹 로그인 상태일 때 -->
                <!--                <li th:if="${session.loginUser != null}"><a href="/users/logout">로그아웃</a></li>-->

</div>

<div class="container" id="main">
    <div class="col-md-12 col-sm-12 col-lg-12">
        <div class="panel panel-default">
          <header class="qna-header">
              <h2 class="qna-title" th:text="${article.title}"></h2>
          </header>
          <div class="content-main">
              <article class="article">
                  <div th:if="${errorMessage}" class="alert alert-danger">
                      <p th:text="${errorMessage}"></p>
                  </div>

                  <div class="article-header">
                      <div class="article-header-thumb">
                          <img src="https://graph.facebook.com/v2.3/100000059371774/picture" class="article-author-thumb" alt="">
                      </div>
                      <div class="article-header-text">
                          <a href="/users/92/kimmunsu" class="article-author-name" th:text="${article.writer}"></a>
                          <a href="/questions/413" class="article-header-time" title="퍼머링크">
                              2015-12-30 01:47
                              <i class="icon-link"></i>
                          </a>
                      </div>
                  </div>
                  <div class="article-doc">
                      <p th:text="${article.contents}"></p>
                  </div>
                  <div class="article-util">
                      <ul class="article-util-list">
                          <li>
                              <a class="link-modify-article" th:href="@{/articles/edit/{articleId}(articleId=${article.id})}">수정</a>
                          </li>
                          <li>
                              <form class="form-delete" th:action="@{/articles/{articleId}(articleId=${article.id})}" method="POST">
                                  <input type="hidden" name="_method" value="DELETE">
                                  <button class="link-delete-article" type="submit">삭제</button>
                              </form>
                          </li>
                          <li>
                              <a class="link-modify-article" href="/">목록</a>
                          </li>
                      </ul>
                  </div>
              </article>

              <div class="qna-comment">
                  <div class="qna-comment-slipp">

                      <!-- 로그인한 사용자만 댓글을 볼 수 있도록 설정 -->
                      <th:block th:if="${session.loginUser != null}">
                          <p class="qna-comment-count">
                              <strong th:text="${#lists.size(replies)}"></strong>개의 의견
                          </p>
                          <div class="qna-comment-slipp-articles">
                              <!-- replyList를 반복 출력 -->
                              <th:block th:each="reply : ${replies}">
                                  <article class="article">
                                      <div class="article-header">
                                          <div class="article-header-text">
                                              <!-- 사용자 이름 출력 -->
                                              <strong th:text="${reply.user.name}"></strong>
                                          </div>
                                      </div>
                                      <div class="article-doc comment-doc">
                                          <p th:text="${reply.contents}"></p>
                                      </div>

                                      <!-- 삭제 버튼 (작성자만 삭제 가능) -->
                                      <th:block th:if="${session.loginUser.id == reply.user.id}">
                                          <form th:action="@{/reply/{replyId}(replyId=${reply.id})}" method="post"
                                                onsubmit="return confirm('댓글을 삭제하시겠습니까?');">
                                              <input type="hidden" name="_method" value="DELETE">
                                              <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                                          </form>
                                      </th:block>

                                  </article>
                              </th:block>

                              <!-- 댓글 입력 폼 -->
                              <form class="submit-write" th:action="@{/reply}" method="post">
                                  <div class="form-group" style="padding:14px;">
                                      <textarea class="form-control" name="contents" placeholder="댓글을 입력하세요"></textarea>
                                  </div>
                                  <input type="hidden" name="userId" th:value="${session.loginUser.id}">
                                  <input type="hidden" name="articleId" th:value="${article.id}">
                                  <button class="btn btn-success pull-right" type="submit">답변하기</button>
                                  <div class="clearfix"></div>
                              </form>
                          </div>
                      </th:block>

                      <!-- 로그인하지 않은 경우 댓글을 숨기고, 로그인 안내 메시지 표시 -->
                      <th:block th:if="${session.loginUser == null}">
                          <p class="text-center text-danger">댓글을 보려면 로그인하세요.</p>
                          <a href="/users/login" class="btn btn-primary">로그인</a>
                      </th:block>

                  </div>
              </div>
          </div>
        </div>
    </div>
</div>

<script type="text/template" id="answerTemplate">
	<article class="article">
		<div class="article-header">
			<div class="article-header-thumb">
				<img src="https://graph.facebook.com/v2.3/1324855987/picture" class="article-author-thumb" alt="">
			</div>
			<div class="article-header-text">
				<a href="#" class="article-author-name">{0}</a>
				<div class="article-header-time">{1}</div>
			</div>
		</div>
		<div class="article-doc comment-doc">
			{2}
		</div>
		<div class="article-util">
		<ul class="article-util-list">
			<li>
				<a class="link-modify-article" href="/api/qna/updateAnswer/{3}">수정</a>
			</li>
			<li>
				<form class="delete-answer-form" action="/api/questions/{3}/answers/{4}" method="POST">
					<input type="hidden" name="_method" value="DELETE">
                     <button type="submit" class="delete-answer-button">삭제</button>
				</form>
			</li>
		</ul>
		</div>
	</article>
</script>

<!-- script references -->
<script src="../js/jquery-2.2.0.min.js"></script>
<script src="../js/bootstrap.min.js"></script>
<script src="../js/scripts.js"></script>
	</body>
</html>
